# Local Supabase for the mobile app. Does not replace the live website backend.
project_id = "uxguard-studio-mobile"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "uxguard://"
additional_redirect_urls = ["uxguard://", "uxguard://reset-password", "exp://"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.delete-account]
verify_jwt = true
